<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Offline – AmaySST Quiz</title>
<style>:root{color-scheme:light dark;--bg:#E7EAEE;--ink:#12161C;--mute:#5E6673;--blue:#0A6FB8;--on:#fff}@media(prefers-color-scheme:dark){:root{--bg:#050607;--ink:#F2F4F7;--mute:#9BA4B0;--blue:#4DB8F5;--on:#001826}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;text-align:center}
main{max-width:380px}h1{margin:12px 0 8px;font-size:26px}p{color:var(--mute)}.b{display:inline-block;margin:6px;padding:12px 22px;border-radius:12px;border:2px solid var(--blue);background:var(--blue);color:var(--on);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.b.g{background:none;color:var(--blue)}</style></head>
<body><main><div style="font-size:48px" aria-hidden="true">📴</div><h1>You’re offline</h1><p>This page isn’t saved on your device yet. Connect to the internet and try again. Once AmaySST Quiz has loaded online, quizzes work without a connection.</p><button class="b" onclick="location.reload()">Try again</button><a class="b g" href="./">Go to home</a></main></body></html>
