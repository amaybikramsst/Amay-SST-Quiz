name: Deploy AmaySST Quiz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Organize folders if uploaded flat
        run: |
          if [ ! -d "src" ]; then
            mkdir -p src/components src/data src/lib public
            for f in App.tsx index.css main.tsx; do
              [ -f "$f" ] && mv "$f" src/
            done
            for f in AdminView.tsx BadgeModal.tsx BottomNav.tsx GateView.tsx Header.tsx HomeView.tsx ProfileView.tsx QuizView.tsx RankView.tsx SubjectsView.tsx; do
              [ -f "$f" ] && mv "$f" src/components/
            done
            for f in benchmarks.ts questions.ts; do
              [ -f "$f" ] && mv "$f" src/data/
            done
            for f in badgeCanvas.ts questionParser.ts quizEngine.ts supabase.ts; do
              [ -f "$f" ] && mv "$f" src/lib/
            done
            for f in amay-avatar.jpg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png; do
              [ -f "$f" ] && mv "$f" public/
            done
            printf '%s\n' 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil((async()=>{try{for(const k of await caches.keys())await caches.delete(k);await self.registration.unregister();for(const c of await self.clients.matchAll({type:"window"}))c.navigate(c.url);}catch{}})()));' > public/sw.js
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build website
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
