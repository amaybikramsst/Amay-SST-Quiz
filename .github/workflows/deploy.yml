name: Deploy AmaySST Quiz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "amaysst-pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Organize folders if uploaded flat
        run: |
          mkdir -p src/components src/data src/hooks src/lib public
          for f in App.tsx index.css main.tsx; do
            if [ -f "$f" ]; then mv -f "$f" src/; fi
          done
          for f in AdminView.tsx BadgeModal.tsx BottomNav.tsx ChatView.tsx GateView.tsx Header.tsx HomeView.tsx LaunchSplash.tsx MsdView.tsx NotificationModal.tsx ProfileView.tsx PWAInstallModal.tsx QuizView.tsx RankBadge.tsx RankView.tsx SubjectsView.tsx; do
            if [ -f "$f" ]; then mv -f "$f" src/components/; fi
          done
          for f in benchmarks.ts questions.ts; do
            if [ -f "$f" ]; then mv -f "$f" src/data/; fi
          done
          for f in usePWAInstall.ts; do
            if [ -f "$f" ]; then mv -f "$f" src/hooks/; fi
          done
          for f in badgeCanvas.ts botSimulator.ts confetti.ts questionParser.ts quizEngine.ts soundEffects.ts supabase.ts; do
            if [ -f "$f" ]; then mv -f "$f" src/lib/; fi
          done
          for f in amay-avatar.jpg msd-badge.jpg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png; do
            if [ -f "$f" ]; then mv -f "$f" public/; fi
          done
          rm -f sw.js public/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build website
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
