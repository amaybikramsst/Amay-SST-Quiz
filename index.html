<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1457E0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AmaySST Quiz" />
    <title>AmaySST Quiz</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <script>
      (function () {
        // 1. Capture Chrome's 1-tap PWA install event immediately before React mounts
        window.__amayDeferredPrompt = null;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          window.__amayDeferredPrompt = e;
          window.dispatchEvent(new Event("amay:install-ready"));
        });
        window.addEventListener("appinstalled", function () {
          window.__amayDeferredPrompt = null;
          try {
            localStorage.setItem("amaysst_pwa_installed", "1");
          } catch (err) {}
          window.dispatchEvent(new Event("amay:app-installed"));
        });

        // 2. Auto-break out of Instagram / Facebook / WhatsApp / Telegram in-app browsers into Chrome on Android
        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isInApp = /FBAN|FBAV|Instagram|WhatsApp|Telegram|Snapchat|Line\/|wv\)/i.test(ua);
        var isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        if (isAndroid && isInApp && !isStandalone) {
          var hostAndPath = window.location.host + window.location.pathname + window.location.search + window.location.hash;
          var fallback = encodeURIComponent(window.location.href);
          window.location.replace(
            "intent://" +
              hostAndPath +
              "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
              fallback +
              ";end"
          );
        }
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
