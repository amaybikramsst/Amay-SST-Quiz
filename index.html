/* PWA layer: install button and popup, offline notice, Android back button, service worker. */
(function(){

function sheet(html,fn){close();cur=fn||close;var d=document.createElement("div");d.id="pw";

document.body.appendChild(d);var lg=document.querySelector("#hd img"),im=d.querySelector("img");if(lg)im.src=lg.src;

function steps(){sheet('<h2 id="pw-t">Add to Home Screen</h2><ol><li>Tap the <b>Share</b> button in Safari’s toolbar.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p>Can’t see it? Open this page in Safari first.</p><button class="b" id="pw-n" type="button">Got it</button>',close);
$("pw-n").onclick=close;$("pw-n").focus()}

p.userChoice.then(function(c){var o=get();if(c.outcome==="accepted")o.done=1;else{o.n++;o.t=Date.now()}put(o);btn()}).catch(btn)}

b.textContent="You’re offline. Quizzes still work; videos and social links need internet.";document.body.appendChild(b)}b.hidden=e&&e.type?e.type==="online":navigator.onLine}
addEventListener("online",net);addEventListener("offline",net);net();
if(typeof render==="function"&&history.pushState){var R=render;
var sync=function(){var h=view==="home"||view==="gate";if(h&&extra){extra=false;skip=true;history.back()}else if(!h&&!extra){extra=true;history.pushState({m:1},"")}};
window.render=function(){R();sync()};
addEventListener("popstate",function(){if(skip){skip=false;return}extra=false;if(view!=="home"&&view!=="gate")go("home")})}
