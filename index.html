      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isStandalone =
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
            navigator.standalone === true ||
            document.referrer.indexOf("android-app://") === 0;
          if (isStandalone) return;
          var isAndroid = /Android/i.test(ua);
          var isInApp =
            /Instagram|FBAN|FBAV|FB_IAB|Messenger|WhatsApp|Snapchat|BytedanceWebview|TikTok|musical_ly|Line\/|Twitter|LinkedInApp|MicroMessenger|GSA\/|; wv\b/i.test(
              ua
            );
          if (!isAndroid || !isInApp) return;
          if (sessionStorage.getItem("amaysst_browser_opened") === "1") return;
          sessionStorage.setItem("amaysst_browser_opened", "1");
          var loc = window.location;
          var scheme = loc.protocol.replace(":", "") || "https";
          var target = loc.host + loc.pathname + loc.search + loc.hash;
          var fallback = encodeURIComponent(loc.href);
          var intentUrl =
            "intent://" +
            target +
            "#Intent;scheme=" +
            scheme +
            ";action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=" +
            fallback +
            ";end";
          window.location.replace(intentUrl);
        } catch (e) {}
      })();
    </script>
  </head>
